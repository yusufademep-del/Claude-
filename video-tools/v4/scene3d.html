<!DOCTYPE html>
<html><head><meta charset="utf-8">

<script src="three.min.js"></script>

<script>
/* Börsenlehre v4 – durchgehende 3D-„Ton“-Stadt. Die Kamera fährt fließend von Station zu Station
   (wie in der finanzlehre-Vorlage); Objekte stehen fest in der Welt und wachsen beim Ankommen heraus.
   renderAt(t) ist deterministisch. Konfiguration über ?seg=<json> (siehe seg.json). */
const P = new URLSearchParams(location.search);
const W = +P.get("w") || 1080, H = +P.get("h") || 1920;
const S = JSON.parse((() => { const r = P.get("seg") || "{}"; try { return decodeURIComponent(r); } catch (e) { return r; } })());
const DUR = S.dur || 30;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const SKY = 0xf3f0f8;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 26, 75);
const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 300);

scene.add(new THREE.HemisphereLight(0xffffff, 0xdcd6e6, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.05);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 5; sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 18, bottom: -8, near: 1, far: 70 });
scene.add(sun); scene.add(sun.target);
const fillL = new THREE.DirectionalLight(0xf3ecff, 0.35); fillL.position.set(-10, 6, 12); scene.add(fillL);

const lin = (h) => new THREE.Color(h).convertSRGBToLinear();
const M = (c, r = 0.85, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: lin(c), roughness: r, metalness: 0 }, extra));
const clay = M(0xf6f4f9), clay2 = M(0xe6e2ee), clay3 = M(0xd9d4e4), dark = M(0x2a2d38, 0.6);
const red = M(0xe0302e, 0.45, { emissive: lin(0x3a0606) }), green = M(0x1aa457, 0.45, { emissive: lin(0x03260f) });
const gold = M(0xf2b705, 0.3, { metalness: 0.6, emissive: lin(0x3a2600) });
const glassRed = new THREE.MeshStandardMaterial({ color: lin(0xff4d4d), roughness: 0.2, transparent: true, opacity: 0.38, emissive: lin(0x400000) });

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOutBack = (x) => { x = clamp(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = (x) => Math.pow(clamp(x), 3);
const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const bounceOut = (x) => { x = clamp(x); const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function cast(o) { o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; }
const FONT = new THREE.Font(window.FONTJSON);
function text3d(str, size, mat, depth = 0.4) {
  const g = new THREE.TextGeometry(str, { font: FONT, size, height: depth, curveSegments: 6, bevelEnabled: true, bevelThickness: size * 0.05, bevelSize: size * 0.03, bevelSegments: 3 });
  g.computeBoundingBox(); const bb = g.boundingBox; g.translate(-(bb.max.x + bb.min.x) / 2, -bb.min.y, -depth / 2);
  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; return m;
}

/* ---------- Fenster-Textur ---------- */
function windowTex(cols, rows, round) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 512; const x = c.getContext("2d");
  x.fillStyle = "#f5f3f9"; x.fillRect(0, 0, 256, 512);
  const cw = 256 / cols, rh = 512 / rows;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    x.fillStyle = "#dcd7e6"; x.fillRect(i * cw + cw * 0.16, j * rh + rh * 0.18, cw * 0.68, rh * 0.62);
    x.fillStyle = "#ebe7f2"; x.fillRect(i * cw + cw * 0.16, j * rh + rh * 0.18, cw * 0.68, rh * 0.12);
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}
const texA = windowTex(4, 10), texB = windowTex(6, 14), texC = windowTex(3, 7);
const winMat = (tex) => new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 });
const matsA = winMat(texA), matsB = winMat(texB), matsC = winMat(texC);

/* ---------- Boden, Straße, Gehweg ---------- */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 200), M(0xf1eef6, 0.95));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const walk = new THREE.Mesh(new THREE.BoxGeometry(400, 0.18, 7), M(0xeae6f1, 0.9)); walk.position.set(100, 0.09, -5.5); walk.receiveShadow = true; scene.add(walk);
const curb = new THREE.Mesh(new THREE.BoxGeometry(400, 0.25, 0.35), clay2); curb.position.set(100, 0.12, -1.9); curb.receiveShadow = true; scene.add(curb);
for (let x = -40; x < 240; x += 4) { const d = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.02, 0.18), M(0xffffff, 0.9)); d.position.set(x, 0.01, 3.2); scene.add(d); }

/* ---------- Gebäude-Bausteine ---------- */
function tower(x, z, w, h, d, mat) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [clay2, clay2, clay, clay, mat, clay2]); b.position.y = h / 2; g.add(b);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.35, d + 0.3), clay); roof.position.y = h + 0.17; g.add(roof);
  const base = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 1.1, d + 0.2), clay3); base.position.y = 0.55; g.add(base);
  g.position.set(x, 0, z); scene.add(cast(g)); return g;
}
function rotunda(x, z, r, h) {
  const g = new THREE.Group();
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 48, 1, false), new THREE.MeshStandardMaterial({ map: windowTex(14, 8), roughness: 0.9 }));
  cyl.material.map.wrapS = THREE.RepeatWrapping; cyl.position.y = h / 2; g.add(cyl);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.15, r + 0.15, 1.6, 48), clay); band.position.y = h + 0.8; g.add(band);
  const door = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.8, 0.3), clay3); door.position.set(0, 1.4, r - 0.05); g.add(door);
  g.position.set(x, 0, z); scene.add(cast(g)); return g;
}
function exchange(x, z, s = 1) {
  const g = new THREE.Group();
  [[8.4, 0.4, 4.4, 0.2], [8.0, 0.4, 4.0, 0.6], [7.6, 0.35, 3.7, 0.97]].forEach(([w, h, d, y], i) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), i % 2 ? clay2 : clay); m.position.y = y; g.add(m); });
  for (let i = 0; i < 6; i++) {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 4.0, 28), clay); c.position.set(-3.1 + i * 1.24, 3.15, 1.25); g.add(c);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.2, 0.85), clay2); cap.position.set(-3.1 + i * 1.24, 5.2, 1.25); g.add(cap);
  }
  const wall = new THREE.Mesh(new THREE.BoxGeometry(7.0, 4.0, 2.0), clay2); wall.position.set(0, 3.15, -0.4); g.add(wall);
  const ent = new THREE.Mesh(new THREE.BoxGeometry(7.8, 0.7, 3.4), clay); ent.position.y = 5.65; g.add(ent);
  const tri = new THREE.Shape(); tri.moveTo(-3.9, 0); tri.lineTo(3.9, 0); tri.lineTo(0, 1.6); tri.lineTo(-3.9, 0);
  const ped = new THREE.Mesh(new THREE.ExtrudeGeometry(tri, { depth: 3.0, bevelEnabled: false }), clay); ped.position.set(0, 6.0, -1.5); g.add(ped);
  g.scale.setScalar(s); g.position.set(x, 0, z); scene.add(cast(g)); return g;
}
function lamp(x, z) {
  const g = new THREE.Group();
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 5.2, 12), clay3); p.position.y = 2.6; g.add(p);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.08, 0.1), clay3); arm.position.set(0.5, 5.15, 0); g.add(arm);
  const hd = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.14, 0.32), clay); hd.position.set(1.0, 5.05, 0); g.add(hd);
  g.position.set(x, 0, z); scene.add(cast(g));
}
function trafficLight(x, z) {
  const g = new THREE.Group();
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 3.6, 12), clay3); p.position.y = 1.8; g.add(p);
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.2, 0.36), M(0xcfcadb)); box.position.y = 3.8; g.add(box);
  for (let i = 0; i < 3; i++) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.06, 16), dark); l.rotation.x = Math.PI / 2; l.position.set(0, 4.18 - i * 0.37, 0.2); g.add(l); }
  g.position.set(x, 0, z); scene.add(cast(g));
}
function tree(x, z) {
  const g = new THREE.Group();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 1.6, 10), clay3); tr.position.y = 0.8; g.add(tr);
  const cr = new THREE.Mesh(new THREE.SphereGeometry(0.85, 20, 14), clay); cr.position.y = 2.1; cr.scale.y = 1.15; g.add(cr);
  g.position.set(x, 0, z); scene.add(cast(g));
}

/* ---------- Die Stadt (Fassadenreihe bei z≈-11, Stationen entlang x) ---------- */
const ST = S.stations || { intro: 0, hook: 18, etf: 36, how: 56, gain: 74, cmp: 92, cup: 110, outro: 128 };
exchange(ST.intro, -10.5, 1.0);
tower(ST.intro - 9, -13, 6, 15, 5, matsA); tower(ST.intro + 9.5, -13.5, 6.5, 12, 5, matsB);
tower(ST.hook - 1, -14, 7, 19, 6, matsB); tower(ST.hook + 7.5, -12.5, 5, 10, 5, matsC);
rotunda(ST.etf, -13, 4.6, 9); tower(ST.etf - 9, -14, 6, 16, 5, matsA); tower(ST.etf + 9, -14, 6, 13, 5, matsC);
tower(ST.etf + 4.5, -21, 7, 24, 6, matsB);
exchange(ST.how, -11.5, 0.9); tower(ST.how + 9, -14, 6, 17, 5, matsA);
tower(ST.gain, -15, 8, 22, 6, matsB); tower(ST.gain - 8.5, -13, 5.5, 11, 5, matsC); tower(ST.gain + 8.5, -13.5, 6, 14, 5, matsA);
rotunda(ST.cmp, -14, 4.0, 11); tower(ST.cmp - 9, -13, 6, 12, 5, matsB); tower(ST.cmp + 9, -13, 6, 18, 5, matsA);
tower(ST.cup, -15, 7, 20, 6, matsA); tower(ST.cup - 8.5, -13, 6, 13, 5, matsC); tower(ST.cup + 8.5, -13, 6, 10, 5, matsB);
exchange(ST.outro, -10.5, 1.0); tower(ST.outro - 9, -13, 6, 14, 5, matsB); tower(ST.outro + 9.5, -13.5, 6.5, 16, 5, matsA);
for (let x = -24; x < 160; x += 9) lamp(x, -2.6);
for (let x = -20; x < 160; x += 18) trafficLight(x + 5.5, -2.4);
for (let x = -16; x < 160; x += 13) tree(x + 2, -7.8);
// zweite Reihe (Tiefe)
for (let x = -30; x < 170; x += 11) tower(x + rnd() * 4, -30 - rnd() * 8, 6 + rnd() * 4, 14 + rnd() * 16, 6, [matsA, matsB, matsC][Math.floor(rnd() * 3)]);

/* ---------- Stations-Objekte ---------- */
const OBJ = {};
function grp(name, x, z) { const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g); OBJ[name] = g; return g; }
function plinth(w, h, d) { const g = new THREE.Group();
  const a = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), clay); a.position.y = h / 2; g.add(a);
  const b = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.18, d + 0.3), clay2); b.position.y = h + 0.09; g.add(b);
  const c = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.18, d + 0.3), clay2); c.position.y = 0.09; g.add(c); return cast(g); }

// Intro: Münzstapel + großes grünes %
const intro = grp("intro", ST.intro, -4.2);
const pct = text3d("%", 2.0, green, 0.7); pct.position.set(2.4, 0, 0); intro.add(pct);
const stacks = [];
[[-2.9, 6], [-1.9, 9], [-2.4, 4]].forEach(([x, n], k) => { const st = new THREE.Group();
  for (let i = 0; i < n; i++) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.16, 32), gold); c.position.y = 0.08 + i * 0.17; c.rotation.y = i; st.add(c); }
  st.position.set(x, 0, k === 2 ? 0.9 : 0); cast(st); intro.add(st); stacks.push(st); });

// Haken: großer roter Angelhaken an Seil + Fragezeichen
const hook = grp("hook", ST.hook, -4.0);
const hookPiv = new THREE.Group(); hookPiv.position.y = 13; hook.add(hookPiv);
const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 8, 8), dark); rope.position.y = -4; hookPiv.add(rope);
const hk = new THREE.Group(); hk.position.y = -8; hookPiv.add(hk);
{ const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 2.2, 20), red); shank.position.y = -1.1; hk.add(shank);
  const eye = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 12, 24), red); eye.position.y = 0.25; hk.add(eye);
  const bend = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.16, 16, 40, Math.PI * 1.25), red); bend.position.set(0.8, -2.2, 0); bend.rotation.z = Math.PI * 0.95; hk.add(bend);
  const barb = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.7, 20), red); barb.position.set(1.55, -1.55, 0); barb.rotation.z = -0.35; hk.add(barb); cast(hk); }
const q = text3d("?", 1.6, dark, 0.45); q.position.set(-2.6, 0, 0.5); hook.add(q);

// ETF-Station: drei Säulen mit Flaggenfarben (unter den Karten sichtbar)
const etf = grp("etf", ST.etf, -3.6);
const etfP = [];
[[-3.1, 0x3c5ccf], [0, 0x2a49b8], [3.1, 0x3c5ccf]].forEach(([x, c], i) => { const p = plinth(1.6, 1.0, 1.6); p.position.x = x; etf.add(p);
  const n = text3d("#" + (i + 1), 0.6, M(c, 0.5), 0.2); n.position.set(0, 1.25, 0); p.add(n); etfP.push(p); });

// Wie geht das: Zahnräder (Mechanik)
const how = grp("how", ST.how, -3.4);
const gears = [];
function gear(r, teeth, mat) { const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.45, 40), mat); body.rotation.x = Math.PI / 2; g.add(body);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.3, r * 0.3, 0.6, 24), clay3); hub.rotation.x = Math.PI / 2; g.add(hub);
  for (let i = 0; i < teeth; i++) { const a = i / teeth * Math.PI * 2; const tth = new THREE.Mesh(new THREE.BoxGeometry(r * 0.28, r * 0.3, 0.45), mat); tth.position.set(Math.cos(a) * r * 1.08, Math.sin(a) * r * 1.08, 0); tth.rotation.z = a; g.add(tth); }
  return cast(g); }
[[-2.6, 1.5, 1.1, 12, clay, 1], [2.5, 1.9, 0.8, 9, gold, -1.44], [3.0, 0.5, 0.6, 8, green, -1.73]].forEach(([x, y, r, n, m, sp]) => { const g = gear(r, n, m); g.position.set(x, y, 0); g.userData.sp = sp; how.add(g); gears.push(g); });

// GEWINN-Szene: Sockel, 3D-Wort, Chartlinie stößt an roten Deckel
const gain = grp("gain", ST.gain, -4.4); gain.scale.setScalar(0.82);
const gp = plinth(7.4, 0.9, 1.8); gain.add(gp);
const letters = []; { const word = (S.txt && S.txt.gain) || "GEWINN"; let x0 = 0;
  for (const ch of word) { const l = text3d(ch, 1.25, dark, 0.55); l.geometry.computeBoundingBox(); const w = l.geometry.boundingBox.max.x - l.geometry.boundingBox.min.x;
    const piv = new THREE.Group(); piv.position.set(x0 + w / 2, 1.0, -0.15); l.position.z = 0.28; piv.add(l); gain.add(piv); letters.push(piv); x0 += w + 0.12; }
  const half = (x0 - 0.12) / 2; letters.forEach(p => p.position.x -= half); }
const ceil = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.16, 2.4), glassRed); ceil.position.set(0, 5.0, -1.2); gain.add(ceil);
const ceilEdge = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.06, 0.06), red); ceilEdge.position.set(0, 5.0, 0); gain.add(ceilEdge);
const ceilTxt = text3d("DECKEL", 0.42, red, 0.08); ceilTxt.position.set(2.9, 5.18, -0.2); gain.add(ceilTxt);
const chartPts = []; { const raw = [[-4.2, 1.4], [-3.2, 2.3], [-2.4, 1.9], [-1.5, 3.3], [-0.6, 2.8], [0.3, 4.1], [1.1, 3.7], [1.9, 4.85], [2.6, 4.85], [3.3, 4.85], [4.2, 4.85]];
  raw.forEach(([x, y]) => chartPts.push(new THREE.Vector3(x, y, -1.2))); }
const chartCurve = new THREE.CatmullRomCurve3(chartPts, false, "catmullrom", 0.15);
const NCH = 160; const chartGeo = new THREE.TubeGeometry(chartCurve, NCH, 0.13, 10, false);
const chart = new THREE.Mesh(chartGeo, green); chart.castShadow = true; gain.add(chart);
const chartHead = new THREE.Mesh(new THREE.SphereGeometry(0.26, 20, 14), green); gain.add(chartHead);
const sparks = []; for (let i = 0; i < 10; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.5, 0.08), red); s.userData.a = (i / 10) * Math.PI - Math.PI; gain.add(s); sparks.push(s); }

// Vergleich: zwei wachsende Säulen
const cmp = grp("cmp", ST.cmp, -3.0);
function bar(mat, x) { const g = new THREE.Group(); const b = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1, 1.7), mat); b.position.y = 0.5; g.add(b); g.position.x = x; g.userData.b = b; cast(g); cmp.add(g); return g; }
const barG = bar(green, -2.7), barR = bar(red, 2.7);
const lblG = text3d("+100 %", 0.5, green, 0.12), lblR = text3d("+50 %", 0.5, red, 0.12); cmp.add(lblG); cmp.add(lblR);

// Pokal + Pfeil
const cup = grp("cup", ST.cup, -4.0);
const cupPl = plinth(2.6, 1.0, 2.0); cup.add(cupPl);
const trophy = new THREE.Group(); trophy.position.y = 1.18; cup.add(trophy);
{ const pts = []; for (let i = 0; i <= 20; i++) { const y = i / 20; pts.push(new THREE.Vector2(0.2 + 1.1 * Math.pow(y, 0.6), y * 1.9)); }
  const c = new THREE.Mesh(new THREE.LatheGeometry(pts, 48), gold); c.position.y = 1.3; trophy.add(c);
  const st = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.3, 1.0, 24), gold); st.position.y = 0.8; trophy.add(st);
  const bs = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.3, 1.0), dark); bs.position.y = 0.15; trophy.add(bs);
  [-1, 1].forEach(sg => { const h = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.09, 12, 32, Math.PI * 1.2), gold); h.position.set(sg * 1.25, 2.3, 0); h.rotation.z = sg > 0 ? -Math.PI * 0.6 : Math.PI * 1.6; trophy.add(h); }); cast(trophy); }
const arrow = new THREE.Group(); { const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 2.2, 20), red); sh.position.y = 1.1; arrow.add(sh);
  const hd = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.0, 28), red); hd.rotation.z = Math.PI; hd.position.y = -0.5; arrow.add(hd); cast(arrow); }
cup.add(arrow);

// Outro: Münzregen
const outro = grp("outro", ST.outro, -3.0);
const coinG = new THREE.CylinderGeometry(0.42, 0.42, 0.09, 32);
const NB = 46, burst = new THREE.InstancedMesh(coinG, gold, NB); burst.castShadow = true; burst.frustumCulled = false; outro.add(burst);
const dirs = []; for (let i = 0; i < NB; i++) { const a = rnd() * 6.28; dirs.push([Math.cos(a) * 0.8, 0.9 + rnd() * 0.6, Math.sin(a) * 0.4, 4 + rnd() * 4, rnd() * 10]); }
const Mx = new THREE.Matrix4(), Qn = new THREE.Quaternion(), Vv = new THREE.Vector3(), S3 = new THREE.Vector3(), Eu = new THREE.Euler();

/* ---------- Kamera ---------- */
// S.cams: [[t, station|x, opts]] – Fahrt startet `lead` s vor t und dauert `move` s; dazwischen langsamer Dolly.
const CAMS = (S.cams || [[0, "intro"]]).map(c => ({ t: c[0], x: typeof c[1] === "string" ? ST[c[1]] : c[1], o: c[2] || {} }));
const MOVE = S.move || 1.25, LEAD = S.lead || 0.45;
function camState(t) {

const appear = (t, t0, d = 0.6) => easeOutBack((t - t0) / d);
